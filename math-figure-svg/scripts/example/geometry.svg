<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340">
  <rect width="680" height="340" fill="#ffffff"/>
  <!-- 半圆填充 -->
  <path d="M110,240 A230,230 0 0 1 570,240 Z" fill="#eef4ff"/>
  <!-- 直径 AB -->
  <line x1="110" y1="240" x2="570" y2="240" stroke="#222" stroke-width="1.6"/>
  <!-- 半圆弧 -->
  <path d="M110,240 A230,230 0 0 1 570,240" fill="none" stroke="#1f6feb" stroke-width="2"/>
  <!-- 垂线 CD（高亮） -->
  <line x1="294" y1="240" x2="294" y2="14.7" stroke="#d9480f" stroke-width="1.8"/>
  <!-- C 处直角标记 -->
  <polyline points="282,240 282,228 294,228" fill="none" stroke="#888" stroke-width="1"/>
  <!-- 圆心 O -->
  <circle cx="340" cy="240" r="3" fill="#222"/>
  <!-- 各点 -->
  <circle cx="110" cy="240" r="3.2" fill="#222"/>
  <circle cx="570" cy="240" r="3.2" fill="#222"/>
  <circle cx="294" cy="240" r="3.2" fill="#222"/>
  <circle cx="294" cy="14.7" r="3.2" fill="#222"/>
</svg>
