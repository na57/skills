  <path d="M780,316 V336 Q780,346 790,346 L940,346 Q950,346 950,356 V574" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  <path d="M950,422 H928" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB)"/>
  <path d="M950,498 H928" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB)"/>
  <path d="M950,574 H928" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB)"/>

  <g font-size="22" fill="#1D4ED8" text-anchor="middle">
