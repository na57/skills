  <path d="M300,316 V336 Q300,346 290,346 L180,346 Q170,346 170,356 V662" fill="none" stroke="#059669" stroke-width="2.5"/>
  <path d="M170,422 H184" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>
  <path d="M170,502 H184" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>
  <path d="M170,582 H184" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>
  <path d="M170,662 H184" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>

