    <rect x="640" y="472" width="280" height="52" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.5"/><text x="780" y="506">3 个重要推论</text>
    <rect x="640" y="548" width="280" height="52" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.5"/><text x="780" y="582">初速度为零的比例</text>
  </g>

