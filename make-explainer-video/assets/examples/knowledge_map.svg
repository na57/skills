  </g>

  <!-- ===== 右列：运动图象 → 3 个叶子（右侧汇流线） ===== -->
  <path d="M1260,316 V336 Q1260,346 1270,346 L1380,346 Q1390,346 1390,356 V574" fill="none" stroke="#DB2777" stroke-width="2.5"/>
  <path d="M1390,422 H1372" fill="none" stroke="#DB2777" stroke-width="2.5" marker-end="url(#arrP)"/>
  <path d="M1390,498 H1372" fill="none" stroke="#DB2777" stroke-width="2.5" marker-end="url(#arrP)"/>
  <path d="M1390,574 H1372" fill="none" stroke="#DB2777" stroke-width="2.5" marker-end="url(#arrP)"/>

  <g font-size="22" fill="#BE185D" text-anchor="middle">
    <rect x="1150" y="396" width="220" height="52" rx="10" fill="#FDF2F8" stroke="#F472B6" stroke-width="2.5"/><text x="1260" y="430">x-t 图象</text>
    <rect x="1150" y="472" width="220" height="52" rx="10" fill="#FDF2F8" stroke="#F472B6" stroke-width="2.5"/><text x="1260" y="506">v-t 图象</text>
    <rect x="1150" y="548" width="220" height="52" rx="10" fill="#FDF2F8" stroke="#F472B6" stroke-width="2.5"/><text x="1260" y="582">图象转换</text>
