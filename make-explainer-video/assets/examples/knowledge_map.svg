  <path d="M780,148 V244" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrO)"/>
  <path d="M780,148 V190 Q780,200 770,200 L310,200 Q300,200 300,210 V244" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrO)"/>
  <path d="M780,148 V190 Q780,200 790,200 L1250,200 Q1260,200 1260,210 V244" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrO)"/>

