  <rect x="1150" y="252" width="220" height="64" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="3"/>
  <text x="1260" y="292" text-anchor="middle" font-size="24" font-weight="700" fill="#9D174D">运动图象</text>

