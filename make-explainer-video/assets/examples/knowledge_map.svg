  <rect x="630" y="668" width="300" height="60" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="3"/>
  <text x="780" y="706" text-anchor="middle" font-size="24" font-weight="700" fill="#9A3412">典型问题与方法</text>

  <!-- 典型问题 → 底部三项（直角走线） -->
  <path d="M780,728 V804" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrO)"/>
  <path d="M780,728 V758 Q780,768 770,768 L390,768 Q380,768 380,778 V804" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrO)"/>
  <path d="M780,728 V758 Q780,768 790,768 L1170,768 Q1180,768 1180,778 V804" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrO)"/>

  <g font-size="22" fill="#C2410C" text-anchor="middle">
    <rect x="240" y="812" width="280" height="56" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="2.5"/><text x="380" y="848">追及相遇问题</text>
    <rect x="640" y="812" width="280" height="56" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="2.5"/><text x="780" y="848">多过程问题</text>
